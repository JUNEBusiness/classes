[project]
name = "cover_letter_and_resume"
version = "0.1.0"
description = "cover_letter_and_resume using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.152.0,<1.0.0"
]

[project.scripts]
cover_letter_and_resume = "cover_letter_and_resume.main:run"
run_crew = "cover_letter_and_resume.main:run"
train = "cover_letter_and_resume.main:train"
replay = "cover_letter_and_resume.main:replay"
test = "cover_letter_and_resume.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
